<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - MAULI TRAVEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div style="background: var(--bg-card); border: 1px solid rgba(255,255,255,0.15); padding: 2.5rem; border-radius: 20px; width: 100%; max-width: 400px; backdrop-filter: blur(10px);">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--accent-cyan);">Admin Portal</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p style="color: var(--accent-red); font-size: 0.9rem; text-align: center; margin-bottom: 1rem;">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn-primary" style="margin-top: 1rem;">Login to Dashboard</button>
    </form>
  </div>

</body>
</html>
