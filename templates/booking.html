{% extends 'base.html' %}{% block title %}Book a Cab | Mauli Travel{% endblock %}{% block content %}<section class="section"><div class="container"><div class="section-head"><div class="eyebrow">Online Booking</div><h2>Reserve your travel date.</h2><p>Green times are available. Red times are already booked.</p></div><form class="form-wrap" method="post"><div class="form-grid"><div class="field"><label>Customer Name *</label><input name="customer_name" value="{{logged_user or ''}}" required></div><div class="field"><label>WhatsApp Number *</label><input name="whatsapp" value="{{session.get('whatsapp','')}}" required></div><div class="field"><label>From *</label><input name="pickup" placeholder="Pickup location" required></div><div class="field"><label>To *</label><input name="destination" placeholder="Destination" required></div><div class="field"><label>Travel Date *</label><input id="travel_date" type="date" name="travel_date" value="{{selected_date or ''}}" required></div><div class="field"><label>Service</label><select name="service"><option>Cab Service</option><option>Tour Package</option><option>Outstation Trip</option></select></div><div class="field full"><label>Available Time *</label><div id="slots" class="slot-grid"></div><input id="travel_time" type="hidden" name="travel_time" required></div><div class="field full"><label>Notes</label><textarea name="notes" rows="4" placeholder="Passengers, return trip, luggage, special request..."></textarea></div></div><button class="btn btn-gold" style="width:100%;margin-top:22px">Submit Booking Request</button></form></div></section>{% endblock %}
